stages:
  - test

# A shell runner with an installed ILIAS 11 test instance, PHP 8.3/8.4,
# Composer 2, Node 22/24 and npm 10/11. Set ILIAS_ROOT on that runner.
# Set USRTO_TEST_CLIENT_INI to enable the isolated database tests.
ilias11:
  stage: test
  tags:
    - ilias11
  script:
    - test -n "$ILIAS_ROOT"
    - composer install --no-interaction --no-plugins --no-scripts
    - composer validate --strict
    - composer check-platform-reqs
    - npm ci --ignore-scripts
    - npm run build
    - git diff --exit-code -- js/dist
    - npm test
    - php "$ILIAS_ROOT/vendor/composer/vendor/bin/phpunit" -c phpunit.xml
